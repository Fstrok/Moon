name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.2.${{ github.run_number }}
        run: |
          # versionCode = номер сборки + 100, чтобы APK из CI ставился поверх локальных сборок
          export VERSION_CODE=$((VERSION_CODE + 100))
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Moon-$VERSION_NAME.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Moon-1.2.${{ github.run_number }}
          path: Moon-*.apk

      - name: Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Moon 1.2.${{ github.run_number }}
          files: Moon-*.apk
